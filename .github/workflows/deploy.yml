name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [claude/fnction-business-dashboard-6sdlkm]
  # Lets the site be rebuilt from the Actions tab without a code change.
  workflow_dispatch:

# Needed to push the built site to the gh-pages branch.
permissions:
  contents: write

# Never let two deploys run at once, but let a queued one finish rather than
# cancelling it, so the last push always ends up live.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the static site
        run: npm run build
        env:
          # A project Pages site is served from /<repo>/, not the domain root.
          NEXT_PUBLIC_BASE_PATH: /FNCTION-DASHBOARD-

      # The site is published to a branch rather than through the Pages
      # deployment API, because "Deploy from a branch" is the source this
      # repository uses. gh-pages holds only generated output and is owned
      # entirely by this workflow, so replacing it each time is correct — there
      # is no history there worth keeping.
      - name: Publish the built site to gh-pages
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/.nojekyll   # stops Pages hiding the _next folder
          cd out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA}"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Where the site will appear
        run: |
          echo "https://fnctionltd.github.io/FNCTION-DASHBOARD-/" >> "$GITHUB_STEP_SUMMARY"
